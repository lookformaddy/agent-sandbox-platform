[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sandbox"
version = "1.0.0"
description = "Sandboxed tool execution for AI agents: isolated sandboxes, fail-closed policy, approvals, resource budgets, hash-chained audit"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.29,<1",
    "pydantic>=2.6,<3",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<9", "httpx>=0.27,<1"]

[project.scripts]
agent-sandbox = "sandbox.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
